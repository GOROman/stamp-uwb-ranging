# Arduino スケッチコンパイル CI
#
# push / pull_request 時に sketches/ 内の全スケッチを M5StampC5 向けにビルド。
# ハードウェアへのフラッシュは行わない（コンパイルのみ）。

name: Arduino Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install M5Stack board package
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32

      - name: List available boards (debug)
        run: |
          arduino-cli board listall | grep -i stamp || true
          arduino-cli board listall | grep -i m5stack || true

      - name: Install M5Stamp_UWB library
        run: |
          arduino-cli lib install "M5Stamp_UWB"

      - name: Compile DS_TWR_TAG
        run: |
          arduino-cli compile \
            --fqbn m5stack:esp32:M5StampC5 \
            --build-property "build.extra_flags=-I${{ github.workspace }}/include" \
            sketches/DS_TWR_TAG

      - name: Compile DS_TWR_ANCHOR
        run: |
          arduino-cli compile \
            --fqbn m5stack:esp32:M5StampC5 \
            --build-property "build.extra_flags=-I${{ github.workspace }}/include" \
            sketches/DS_TWR_ANCHOR
